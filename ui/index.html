<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyGrade</title>
<style>
/* Design by Valery (docs/design/review-flow-sketch.html), wired to the app's Python backend.
   System fonts only: the app works offline and sends nothing out. */
:root {
  --bg: #f5f4f8; --card: #ffffff; --soft: #f8f7fb; --line: #e4e1eb; --fg: #1b1830; --muted: #69637e;
  --accent: #6d28d9; --accent-fg: #ffffff; --accent-soft: #efe8fc; --track: #ebe8f2;
  --warn: #8f5400; --warn-soft: #fcf1dc; --ok: #1d7a4a; --ok-soft: #e3f3ea; --bad: #b0222b; --bad-soft: #fbe2e3;
  --code-bg: #f7f8fa;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111018; --card: #1a1825; --soft: #1f1c2b; --line: #302b42; --fg: #ece9f5; --muted: #a39cb8;
    --accent: #a78bfa; --accent-fg: #1e1236; --accent-soft: #2a2045; --track: #2a263a;
    --warn: #f0b457; --warn-soft: #36290f; --ok: #5fd194; --ok-soft: #16301f; --bad: #f27e85; --bad-soft: #38191c;
    --code-bg: #11161d; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); padding-inline: 16px; padding-block: 20px 64px; }
[hidden] { display: none !important; }
.page { max-width: 960px; margin: 0 auto; display: grid; gap: 20px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 13px; font-weight: 600; color: var(--accent); }
.topbar .where { font: 12px var(--font-mono); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.pill.ai { background: var(--accent-soft); color: var(--accent); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.primary { border: 0; padding: 11px 20px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { color: var(--accent-fg); filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; font-size: 14px; }
.link-btn:disabled { opacity: .4; cursor: not-allowed; }

/* review header, steps, list */
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.head h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.head .sub { color: var(--muted); margin-top: 2px; }
.steps { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; padding: 12px 16px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; color: var(--muted); }
.steps li { display: flex; gap: 8px; align-items: center; }
.steps b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cols, .row { display: grid; grid-template-columns: minmax(0, 2.2fr) 110px minmax(0, 2.4fr) minmax(0, 1.2fr) 150px; gap: 16px; align-items: center; padding: 0 20px; }
.cols { font-size: 12px; font-weight: 600; color: var(--muted); padding-block: 12px; border-bottom: 1px solid var(--line); background: var(--soft); }
.team { border-bottom: 1px solid var(--line); }
.team:last-child { border-bottom: 0; }
.row { padding-block: 16px; }
.open-btn { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; min-width: 0; }
.open-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chev { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--soft); color: var(--muted); transition: transform .15s; font-size: 14px; }
.open-btn[aria-expanded="true"] .chev { transform: rotate(90deg); background: var(--accent-soft); color: var(--accent); }
.names { font-weight: 600; overflow-wrap: anywhere; }
.team-id { font-size: 12px; color: var(--muted); }
.grade { font-size: 20px; font-weight: 700; }
.grade small { font-size: 13px; font-weight: 400; color: var(--muted); }
.attn { font-size: 14px; min-width: 0; }
.attn .first { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.attn .more { font-size: 12px; color: var(--muted); }
.attn.none { color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.clear { color: var(--muted); padding-inline: 0; }
.review-btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 8px 12px; font-size: 14px; font-weight: 500; justify-self: end; white-space: nowrap; }
.review-btn:hover { border-color: var(--accent); color: var(--accent); }
.review-btn.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.review-btn:disabled { opacity: .4; cursor: not-allowed; }

/* dropdown details */
.details { padding: 4px 20px 24px 56px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px 32px; background: var(--soft); border-top: 1px solid var(--line); }
.overall { grid-column: 1 / -1; margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.overall p { margin: 0; font-size: 15px; max-width: 70ch; }
.overall .label { font-size: 13px; font-weight: 600; }
.extremes { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
.extremes b { color: var(--fg); font-weight: 600; }
.details h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; }
.details h3 span { font-weight: 400; color: var(--muted); }
.bullets { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.ai-box { border-radius: 10px; padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }
.ai-box.warn { background: var(--warn-soft); }
.ai-box.clear { background: var(--card); color: var(--muted); border: 1px solid var(--line); }
.ai-box .note { font-size: 12.5px; color: var(--muted); }
.cats { display: grid; gap: 14px; }
.cat-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.cat-name { font-weight: 500; }
.cat-score { white-space: nowrap; }
.cat-score input { width: 64px; font: inherit; text-align: right; border: 1px solid var(--accent); border-radius: 7px; padding: 2px 6px; background: var(--card); color: var(--fg); }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 6px 0 4px; }
.bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.cat-why { font-size: 13px; color: var(--muted); margin: 0; }
.cat-ev { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.ev { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 2px 9px; font: 12px var(--font-mono); }
.ev:hover { border-color: var(--accent); color: var(--accent); }
.changed { font-size: 13px; color: var(--accent); }
.change-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 14px; }
.det-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px var(--font-ui); background: var(--card); color: var(--fg); resize: vertical; }
.cmt { margin-top: 6px; }

/* start, match and progress screens */
.start { max-width: 600px; width: 100%; margin: 8px auto 0; display: grid; gap: 18px; }
.start.wide { max-width: 880px; }
.start h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.start .lead { margin: 0; color: var(--muted); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 20px; }
.field { display: grid; gap: 8px; }
.field > label, .field > .label { font-size: 14px; font-weight: 600; }
select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.folder { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--soft); }
.folder.chosen { border-color: var(--accent); background: var(--card); }
.folder-icon { flex: none; width: 22px; height: 17px; border-radius: 3px; background: var(--accent-soft); border: 2px solid var(--accent); position: relative; }
.folder-icon::before { content: ""; position: absolute; left: -2px; top: -6px; width: 9px; height: 5px; border-radius: 2px 2px 0 0; background: var(--accent); }
.folder-path { flex: 1; min-width: 0; font: 13px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.folder.chosen .folder-path { color: var(--fg); }
.hint { font-size: 13px; color: var(--muted); }
.preview { border-radius: 12px; padding: 12px 14px; background: var(--soft); display: grid; gap: 6px; font-size: 14px; }
.preview .ok-line { color: var(--ok); font-weight: 500; }
.preview .warn-line { color: var(--warn); }
.privacy { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.privacy span:first-child { color: var(--ok); }
.rubric-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rubric-row select { flex: 1; min-width: 0; }
.rubric-used { font-size: 13px; color: var(--ok); }
.rubric-panel { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; background: var(--soft); }
.rubric-panel .panel-title { font-size: 14px; font-weight: 600; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mini tr:last-child td { border-bottom: 0; }
.mini .ranges { color: var(--muted); }
.start-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.match-summary { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; }
.match-summary .ok-line { color: var(--ok); font-weight: 500; }
.match-summary .warn-line { color: var(--warn); font-weight: 500; }
.match-list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.m-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) 150px; gap: 12px 20px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.m-row:last-child { border-bottom: 0; }
.m-row.needs { background: var(--warn-soft); }
.m-who b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.m-files { display: grid; gap: 6px; min-width: 0; }
.m-file { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.m-file .ftype { color: var(--muted); }
.m-file .fname { font: 12.5px/1.4 var(--font-mono); overflow-wrap: anywhere; }
.m-file .missing { color: var(--warn); font-weight: 500; }
.m-file select { font: 13px var(--font-ui); border: 1px solid var(--warn); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
.m-status { font-size: 13px; font-weight: 600; justify-self: end; text-align: right; }
.m-status.ok { color: var(--ok); } .m-status.warn { color: var(--warn); } .m-status.muted { color: var(--muted); font-weight: 500; }
.mode { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--soft); }
.mode legend { font-size: 14px; font-weight: 600; padding: 0 6px; }
.mode label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.mode input { margin-top: 4px; }
.mode small { display: block; color: var(--muted); font-size: 13px; }
.steps-run { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.steps-run li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.state { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.state.running { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.state.done { background: var(--ok); border-color: var(--ok); color: var(--card); }
.state.warn { background: var(--warn); border-color: var(--warn); color: var(--card); }
.state.skip { background: var(--track); border-color: var(--track); color: var(--muted); }
.steps-run .what { font-weight: 500; }
.steps-run .what small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.steps-run .count { color: var(--muted); font-size: 14px; }
.run-bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.run-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.found { font-size: 14px; color: var(--muted); margin: 0; }
.fail { font-size: 13px; color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
.note-box { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.note-box.warn { border-color: var(--warn); background: var(--warn-soft); }

/* footer */
.foot { display: flex; flex-wrap: wrap; gap: 12px 20px; justify-content: space-between; align-items: center; }
.foot .muted { font-size: 14px; }
.foot-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.export-note { font-size: 14px; }
.export-note .path { font: 12.5px var(--font-mono); overflow-wrap: anywhere; }
details.more { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--card); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .25); z-index: 30; }
.toast.err { background: var(--bad); color: #fff; }

/* modal and evidence drawer */
.modal-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; padding: 24px; z-index: 20; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(560px, 100%); max-height: calc(100vh - 48px); overflow: auto; display: grid; gap: 14px; box-shadow: 0 20px 50px rgb(0 0 0 / .3); }
.modal .field input[type=text], .modal .field input[type=password] { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: 13px var(--font-mono); background: var(--card); color: var(--fg); width: 100%; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.drawer-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 15; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100%); background: var(--card); border-left: 1px solid var(--line); z-index: 16; display: grid; grid-template-rows: auto auto 1fr; box-shadow: -12px 0 40px rgb(0 0 0 / .2); }
.drawer-top { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-top h2 { font-size: 16px; overflow-wrap: anywhere; }
.tabs { display: flex; border-bottom: 1px solid var(--line); align-items: center; padding-inline: 8px; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .file { margin-left: auto; padding: 0 10px; font: 11px var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ev-body { padding: 14px; display: grid; gap: 10px; overflow: auto; align-content: start; }
.cell { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; border-radius: 6px; padding: 4px; transition: background .3s; }
.cell .in { font: 11px var(--font-mono); color: var(--muted); padding-top: 8px; text-align: right; line-height: 1.3; }
.cell pre { margin: 0; font: 12px/1.5 var(--font-mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
.cell .md { padding: 4px 10px; white-space: pre-wrap; }
.cell .out { font: 12px/1.5 var(--font-mono); padding: 6px 10px; white-space: pre; overflow-x: auto; }
.cell .out.err { color: var(--bad); background: var(--bad-soft); border-radius: 6px; }
.cell img { max-width: 100%; height: auto; display: block; margin-top: 6px; background: #fff; border-radius: 4px; }
.cell.hl { background: var(--warn-soft); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
video { width: 100%; border-radius: 8px; background: #000; max-height: 60vh; }

@media (max-width: 760px) {
  .cols { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
  .row .grade { justify-self: end; }
  .row .attn, .row .ai-cell { grid-column: 1 / -1; padding-left: 36px; }
  .row .review-btn { grid-column: 1 / -1; justify-self: start; margin-left: 36px; }
  .details { grid-template-columns: minmax(0, 1fr); padding-left: 20px; }
  .m-row { grid-template-columns: minmax(0, 1fr); }
  .m-status { justify-self: start; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .chev, .run-bar span { transition: none; } .state.running { animation: none; } }
</style>

<body>
<div class="page" id="root"><p class="muted">Starting…</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
"use strict";
// ---------------------------------------------------------------------------
// State. Python is the source of truth; this only remembers what is on screen.
// ---------------------------------------------------------------------------
const S = {
  view: "start",            // start | match | run | review
  state: null,              // api.get_state()
  review: null,             // api.get_review()
  rubrics: [],              // built-in rubrics for the dropdown
  rubricPick: null,         // value of the dropdown: a file name, or "current"
  rubricPreview: null,      // preview of the picked rubric
  replaceOpen: false,       // the "Replace rubric" panel
  pending: null,            // {path, name, ...preview} chosen in the panel, not used yet
  usedNote: "",             // "Using the rubric from ..."
  replaceWarn: null,        // the rubric can't be changed without losing scores
  matches: null,            // api.get_matches()
  mode: null,               // how to grade: ai | sim | hand
  regrade: false,
  run: null,                // progress of the grading run
  open: {},                 // review rows that are expanded
  editing: {},              // review rows whose scores are being changed
  ev: null,                 // evidence drawer: {id, data, tab, hl}
  settings: null,           // Settings window
  exportNote: null,         // result of the last export
  includeUnapproved: false,
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n == null ? "—" : String(Math.round(n * 10) / 10));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const isMac = /Mac/i.test(navigator.platform || navigator.userAgent);

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.hidden = false;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => (t.hidden = true), isErr ? 6000 : 3200);
}

// Call Python. Returns the result, or {failed, error} after showing the error.
async function call(name, ...args) {
  try {
    const r = await window.pywebview.api[name](...args);
    if (!r || r.ok === false) {
      if (!(r && r.cancelled)) toast((r && r.error) || "Something went wrong.", true);
      return r && r.error ? { failed: true, error: r.error } : null;
    }
    return r;
  } catch (e) {
    toast(String((e && e.message) || e), true);
    return null;
  }
}
const ok = (r) => r && !r.failed;
async function callQuiet(name, ...args) {
  try {
    const r = await window.pywebview.api[name](...args);
    return r && r.ok !== false ? r : { failed: true, error: (r && r.error) || "Something went wrong." };
  } catch (e) {
    return { failed: true, error: String((e && e.message) || e) };
  }
}

async function refreshState() {
  const st = await call("get_state");
  if (ok(st)) S.state = st;
}
async function refreshReview() {
  if (!S.state || !S.state.rubric) { S.review = null; return; }
  const rv = await call("get_review");
  if (ok(rv)) S.review = rv;
}
async function refreshAll() { await refreshState(); await refreshReview(); }
async function refreshMatches() {
  if (!S.state || !S.state.folder) { S.matches = null; return; }
  const m = await call("get_matches");
  if (ok(m)) S.matches = m;
}

function ranges(levels, points) {
  return levels.map((l, i) => {
    const hi = i === 0 ? points : levels[i - 1].min - 1;
    return `${esc(l.label)} ${l.min === hi ? fmt(l.min) : fmt(l.min) + "–" + fmt(hi)}`;
  }).join(" · ");
}
function rubricTable(r) {
  return `<table class="mini">${r.criteria.map((c) => `<tr><td>${esc(c.name)}</td><td class="num">${fmt(c.points)} pts</td><td class="ranges num">${ranges(c.levels, c.points)}</td></tr>`).join("")}</table>`;
}
const rubricLine = (r) => `${esc(r.assignment)} · ${fmt(r.total_points)} points · ${plural(r.criteria.length, "category", "categories")}`;
const sortedRows = () => [...S.review.rows].sort((a, b) => (a.status === "approved") - (b.status === "approved") || b.check.length - a.check.length || a.name.localeCompare(b.name));
const aiOn = () => !!(S.state && S.state.ai_ready);

function topbar() {
  const st = S.state;
  return `<div class="topbar"><span class="brand">EasyGrade</span>
    <span class="where" title="${esc(st && st.folder)}">${st && st.folder ? esc(st.folder) : ""}</span>
    <span class="right">${aiOn() ? `<span class="pill ai" title="Notebook text and charts are sent to the AI service for grading. Videos never leave this computer.">AI grading on</span>` : `<span class="pill" title="Files are read and processed on this computer">Runs locally</span>`}
    <button class="btn small" data-act="settings">Settings</button></span></div>`;
}

function viewRun() {
  const r = S.run;
  if (!r) return "";
  const N = r.total;
  const done = r.steps.reduce((sum, s) => sum + (s.state === "done" || s.state === "skip" ? N : s.n), 0);
  const pct = Math.round((100 * done) / (r.steps.length * Math.max(N, 1)));
  return `<section class="start" aria-labelledby="run-title">
    <h1 id="run-title">${r.finished ? `Done: ${plural(N, "team")} ${N === 1 ? "is" : "are"} ready for your review` : `Grading ${plural(N, "team")}`}</h1>
    <p class="lead">${r.finished ? esc(r.lead) : "This can take a few minutes for a full class. You can leave this window open."}</p>
    <div class="panel">
      <div class="run-bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
      <ol class="steps-run" aria-live="polite">${r.steps.map((s) => `<li><span class="state ${s.state}" aria-hidden="true">${s.state === "done" ? "✓" : s.state === "warn" ? "!" : s.state === "skip" ? "–" : ""}</span>
        <span class="what">${esc(s.what)}<small>${esc(s.detail)}</small></span>
        <span class="count num">${s.state === "waiting" ? "" : s.state === "skip" ? "Skipped" : `${s.n} of ${s.total ?? N}${s.extra ? " · " + esc(s.extra) : ""}`}</span></li>`).join("")}</ol>
      ${r.found ? `<p class="found">${esc(r.found)}</p>` : ""}
      ${r.failed.map((f) => `<div class="fail">${esc(f.name)}: ${esc(f.error)}</div>`).join("")}
      ${r.tokens ? `<p class="hint">${r.tokens.toLocaleString()} tokens used. Your API console shows the exact cost.</p>` : ""}
      <div class="start-actions"><span class="actions">${r.running ? `<button class="btn" data-act="stop" ${r.stop ? "disabled" : ""}>Stop</button>` : `<button class="link-btn" data-act="back-match">Back to matches</button>`}</span>
        ${r.finished ? `<button class="btn primary" data-act="to-review" id="to-review">Review the grades</button>` : ""}</div>
    </div>
  </section>`;
}

    : "Nothing to check"}</span>`;
}
function rowHtml(r) {

    ? `<button class="review-btn" data-fill="${esc(r.id)}" title="Add the missing score first">Add missing score</button>`

  const head = `<div class="row">
    <button class="open-btn" data-toggle="${esc(r.id)}" aria-expanded="${open}" aria-controls="d-${esc(r.id)}"><span class="chev" aria-hidden="true">›</span>

        ${diff ? `<span class="changed num">${diff > 0 ? "+" : ""}${fmt(diff)} from the suggestion</span>` : ""}

function critHtml(r, c, editing) {
  const s = c.final;
  const input = editing || s == null;
  const label = s == null ? `<span style="color:var(--warn);font-weight:600">Needs your score</span>` : esc(c.level || "");
  const low = c.confidence != null && c.confidence < 0.7;
  return `<div>
    <div class="cat-top"><span class="cat-name">${esc(c.name)}</span>
      <span class="cat-score num">${input
        ? `<label for="in-${esc(r.id)}-${esc(c.id)}" style="position:absolute;left:-9999px">${esc(c.name)} score</label><input id="in-${esc(r.id)}-${esc(c.id)}" type="number" min="0" max="${c.points}" step="0.5" value="${s ?? ""}" placeholder="—" data-score="${esc(r.id)}|${esc(c.id)}">`
        : `<b>${fmt(s)}</b>`} / ${fmt(c.points)} · ${label}</span></div>
    <div class="bar" aria-hidden="true"><span style="width:${s == null ? 0 : Math.round((100 * s) / c.points)}%"></span></div>
    ${c.reason ? `<p class="cat-why">${esc(c.reason)}</p>` : s == null ? `<p class="cat-why">${c.source === "video" && !r.has_video ? "No video, so this is yours to score." : "Not scored yet."}</p>` : c.ai_score == null ? `<p class="cat-why">Entered by you.</p>` : ""}
    <p class="cat-ev">${c.evidence.map((e) => `<button class="ev" data-ev="${esc(e)}" data-evid="${esc(r.id)}">${esc(e)}</button>`).join("")}${c.confidence != null ? `<span>${Math.round(c.confidence * 100)}% sure${low ? " · check this" : ""}</span>` : ""}${c.changed ? `<span class="changed">changed from ${fmt(c.ai_score)}</span>` : ""}</p>
    ${s != null && (editing || c.changed || c.comment) ? `<textarea class="cmt" rows="2" data-cmt="${esc(r.id)}|${esc(c.id)}" placeholder="Why you changed it (goes in the student's feedback)">${esc(c.comment)}</textarea>` : ""}
  </div>`;
}
function exportNoteHtml() {

function notebookHTML(d) {
  const nb = d.notebook;
  if (!d.notebook_name) return `<div class="empty">No notebook in this submission.</div>`;
  if (nb.error) return `<div class="empty">${esc(nb.error)}</div>`;
  return nb.cells.map((c) => {
    const outs = c.outputs.map((o) => o.kind === "image" ? `<img alt="Cell ${c.n} output" src="${esc(o.src)}">` : `<div class="out${o.kind === "error" ? " err" : ""}">${esc(o.text)}</div>`).join("");
    const body = c.type === "markdown" ? `<div class="md">${esc(c.source)}</div>` : `<pre>${esc(c.source)}</pre>${outs}`;
    return `<div class="cell${S.ev.hl === c.n ? " hl" : ""}" id="cell-${c.n}"><div class="in">#${c.n}${c.type === "code" ? `<br>[${c.count ?? " "}]` : ""}</div><div style="min-width:0">${body}</div></div>`;
  }).join("");
}
function videoHTML(d) {
  if (!d.video_url) return `<div class="empty">${d.video_name ? "The video file can't be opened." : "No video in this submission."}</div>`;
  return `<video id="vid" controls preload="metadata" src="${esc(d.video_url)}"></video><p class="muted" style="font-size:13px">${esc(d.video_name)}. The transcript will show here once video grading is connected.</p>`;
}
function viewDrawer() {
  const e = S.ev;
  if (!e) return "";
  const d = e.data;
  const fname = e.tab === "notebook" ? d.notebook_name : d.video_name;
  return `<div class="drawer-bg" data-act="close-drawer"></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="Evidence for ${esc(d.name || d.id)}">
      <div class="drawer-top"><h2>${esc(d.name || d.id)}</h2><button class="btn small" data-act="close-drawer">Close</button></div>
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="notebook" aria-selected="${e.tab === "notebook"}">Notebook</button><button class="tab" role="tab" data-tab="video" aria-selected="${e.tab === "video"}">Video</button><span class="file" title="${esc(fname || "")}">${esc(fname || "")}</span></div>
      <div class="ev-body" id="evbody">${e.tab === "notebook" ? notebookHTML(d) : videoHTML(d)}</div></aside>`;
}
function viewSettings() {
  const t = S.settings;
  if (!t) return "";
  return `<div class="modal-bg" data-act="close-settings-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <h2 id="set-title">Settings</h2>
    <div class="field"><label for="set-key">API key</label>
      <input type="password" id="set-key" placeholder="${t.has_key ? esc("Saved: " + t.key_hint + "  (type a new one to replace it)") : "sk-ant-…"}" autocomplete="off">
      <span class="hint">${t.key_source === "environment" ? "Using the ANTHROPIC_API_KEY environment variable. " : ""}Saved only on this computer, in <span class="mono">${esc(t.settings_file)}</span>. Never put it in the repo.</span></div>
    <div class="field"><label for="set-model">Model</label>
      <input type="text" id="set-model" value="${esc(t.model)}" spellcheck="false">
      <span class="hint">The model name from your API console, for example claude-sonnet-5-5.</span></div>
    <label class="check"><input type="checkbox" id="set-anon" ${t.anonymize ? "checked" : ""}><span><b>Remove names before sending</b><br><span class="hint">Replaces the student's full name, ID and email in the notebook with [STUDENT]. First names written alone aren't caught.</span></span></label>
    <label class="check"><input type="checkbox" id="set-img" ${t.send_images ? "checked" : ""}><span><b>Send chart images</b><br><span class="hint">Lets the AI see the charts (better grading of analysis categories, slightly higher cost).</span></span></label>
    <p class="hint">What gets sent: the rubric and the notebook (code, outputs, charts). Videos never leave this computer. Each request is saved in <span class="mono">_grading/ai_log/</span>.</p>
    <div class="actions"><button class="btn primary" data-act="save-settings">Save</button><button class="btn" data-act="test-connection" ${t.has_key ? "" : "disabled"}>Test connection</button>${t.has_key && t.key_source === "settings" ? `<button class="btn" data-act="remove-key">Remove key</button>` : ""}<button class="btn" data-act="close-settings" style="margin-left:auto">Close</button></div>
  </div></div>`;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render() {
  const root = $("#root");
  if (!S.state) { root.innerHTML = `<p class="muted">Starting…</p>`; return; }
  const body = { start: viewStart, match: viewMatch, run: viewRun, review: viewReview }[S.view]();
  const y = window.scrollY, ey = $("#evbody") ? $("#evbody").scrollTop : 0;
  root.innerHTML = topbar() + body + viewDrawer() + viewSettings();
  if (S.view !== "run") window.scrollTo(0, y);
  if ($("#evbody")) $("#evbody").scrollTop = ey;
}
function show(view) { S.view = view; render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
async function loadRubricChoices() {
  const r = await call("list_rubrics");
  S.rubrics = ok(r) ? r.rubrics : [];
  const cur = S.state && S.state.rubric;
  if (cur) S.rubricPick = S.rubrics.some((x) => x.assignment === cur.assignment) ? S.rubrics.find((x) => x.assignment === cur.assignment).file : "current";
  else if (!S.rubricPick || !S.rubrics.some((x) => x.file === S.rubricPick)) {
    const cap = S.rubrics.find((x) => /CAP3321C/i.test(x.assignment));
    S.rubricPick = (cap || S.rubrics[0] || {}).file || null;
  }
  await loadRubricPreview();
}
async function loadRubricPreview() {
  S.rubricPreview = null;
  if (S.rubricPick === "current" && S.state.rubric) { S.rubricPreview = S.state.rubric; return; }
  if (S.rubricPick) {
    const p = await call("preview_builtin_rubric", S.rubricPick);
    if (ok(p)) S.rubricPreview = p;
  }
}
// Make the dropdown's rubric the one in use. Returns false if it couldn't (and shows why).
async function applyRubricChoice(replace) {
  const cur = S.state.rubric;
  if (S.rubricPick === "current" || (cur && S.rubrics.some((x) => x.file === S.rubricPick && x.assignment === cur.assignment))) return true;
  const r = await call("use_builtin_rubric", S.rubricPick, !!replace);
  if (r && r.failed && /already has scores/.test(r.error)) { S.replaceWarn = r.error; render(); return false; }
  if (!ok(r)) return false;
  S.state = r; S.replaceWarn = null;
  await refreshReview();
  return true;
}

async function goMatch() {
  await refreshMatches();
  show("match");
}

async function runGrading() {
  const rows = S.state.students;
  const N = rows.length;
  const mode = S.mode;
  const run = S.run = {
    total: N, running: true, finished: false, stop: false, failed: [], tokens: 0, found: "", lead: "",
    steps: [
      { what: "Finding each team's notebook and video", detail: "Looks inside the folder and the roster", state: "waiting", n: 0 },
      { what: "Transcribing videos on this computer", detail: "Not connected yet: you'll score the presentation yourself", state: "waiting", n: 0 },
      { what: "Reading the notebooks", detail: "Header, run order, errors and file name", state: "waiting", n: 0 },
      { what: mode === "ai" ? "Suggesting grades with the AI" : mode === "sim" ? "Filling in made-up scores" : "Suggesting grades", detail: mode === "hand" ? "Skipped: you chose to score by hand" : "Every score comes with a reason", state: "waiting", n: 0 },
    ],
  };
  show("run");
  const draw = () => { if (S.view === "run") render(); };
  // 1. files
  run.steps[0].state = "running"; draw();
  run.steps[0].n = N; run.steps[0].state = "done";
  const noVideo = rows.filter((s) => !s.has_video).length;
  const noNb = rows.filter((s) => !s.has_notebook).length;
  run.found = `${plural(N, "team")} found. ${noVideo ? plural(noVideo, "team") + " ha" + (noVideo === 1 ? "s" : "ve") + " no video, so you'll add the presentation score yourself. " : "Every team has a video. "}${noNb ? plural(noNb, "team") + " ha" + (noNb === 1 ? "s" : "ve") + " no notebook. " : ""}`;
  // 2. transcripts are not connected
  run.steps[1].state = "skip"; draw();
  // 3. notebook checks
  run.steps[2].state = "running"; run.steps[2].total = rows.filter((s) => s.has_notebook).length; draw();
  for (const s of rows.filter((x) => x.has_notebook)) {
    if (run.stop) break;
    await callQuiet("analyze_notebook", s.id);
    run.steps[2].n++; draw();
  }
  run.steps[2].state = "done";
  await refreshState();
  // 4. grading
  const fresh = (s) => S.regrade || s.status === "pending";
  if (mode === "hand" || run.stop) { run.steps[3].state = "skip"; }
  else {
    const list = S.state.students.filter((s) => fresh(s) && (mode === "sim" ? (s.has_notebook || s.has_video) : s.has_notebook));
    run.steps[3].state = "running"; run.steps[3].total = list.length; draw();
    let next = 0;
    const work = async () => {
      while (next < list.length && !run.stop) {
        const s = list[next++];
        const r = await callQuiet(mode === "sim" ? "grade_simulated" : "grade_student", s.id);
        if (r.failed) {
          run.failed.push({ name: s.name || s.id, error: r.error });
          if (/API key|wasn't found|Settings/.test(r.error)) run.stop = true;
        } else if (r.usage) run.tokens += (r.usage.input_tokens || 0) + (r.usage.output_tokens || 0);
        run.steps[3].n++; run.steps[3].extra = run.failed.length ? plural(run.failed.length, "failed") : ""; draw();
      }
    };
    await Promise.all(mode === "ai" ? [work(), work(), work()] : [work()]);
    run.steps[3].state = run.failed.length ? "warn" : "done";
  }
  run.running = false; run.finished = true;
  await refreshAll();
  const missing = S.review ? S.review.rows.filter((r) => !r.complete).length : 0;
  run.lead = "Grades are suggestions until you mark each team reviewed." + (missing ? ` ${plural(missing, "team")} still need${missing === 1 ? "s" : ""} a score from you.` : "");
  draw();
  const b = $("#to-review"); if (b) b.focus();
}

async function toReview() {
  await refreshAll();
  if (!S.review) { toast("Choose a rubric first.", true); return; }
  const first = sortedRows().find((r) => r.status !== "approved");
  S.open = first ? { [first.id]: true } : {};
  show("review");
}

async function loadEvidence(id, tab, hl) {
  const d = await call("get_student", id);
  if (!ok(d)) return;
  S.ev = { id, data: d, tab, hl: hl ?? null };
  render();
  if (hl) {
    const el = $("#cell-" + hl), body = $("#evbody");
    if (el && body) body.scrollTop += el.getBoundingClientRect().top - body.getBoundingClientRect().top - 12;
  }
}
function seekVideo(sec) {
  const v = $("#vid");
  if (!v) return;
  const go = () => { v.currentTime = sec; };
  if (v.readyState >= 1) go(); else v.addEventListener("loadedmetadata", go, { once: true });
}

async function setScore(id, crit, value) {
  const r = await call("set_score", id, crit, value);
  if (ok(r)) { await refreshAll(); render(); }
}

async function onAct(act, el) {
  if (act === "choose-folder") {
    const st = await call("choose_folder");
    if (ok(st)) await afterFolder(st);
  } else if (act === "use-sample") {
    toast("Building the sample folder…");
    const st = await call("create_sample_folder");
    if (ok(st)) { await afterFolder(st); toast("Sample folder ready."); }
  } else if (act === "toggle-replace") {
    S.replaceOpen = !S.replaceOpen; if (!S.replaceOpen) S.pending = null; render();
  } else if (act === "cancel-replace") {
    S.replaceOpen = false; S.pending = null; render();
  } else if (act === "pick-rubric-file") {
    const p = await call("choose_rubric_preview");
    if (ok(p)) { S.pending = p; render(); }
  } else if (act === "save-template") {
    const r = await call("save_rubric_template");
    if (ok(r)) toast("Template saved: " + r.path);
  } else if (act === "use-pending") {
    const p = S.pending; if (!p) return;
    const r = await call("use_rubric", p.path, false);
    if (r && r.failed && /already has scores/.test(r.error)) { S.replaceWarn = r.error; S.pendingUse = p.path; render(); return; }
    if (ok(r)) { S.state = r; S.replaceOpen = false; S.pending = null; S.usedNote = `✓ Using the rubric from ${p.name}`; await loadRubricChoices(); await refreshReview(); render(); }
  } else if (act === "replace-anyway") {
    const path = S.pendingUse; S.replaceWarn = null;
    const r = path ? await call("use_rubric", path, true) : null;
    if (path && ok(r)) { S.state = r; S.replaceOpen = false; S.pending = null; S.pendingUse = null; S.usedNote = "✓ Rubric replaced. Grades will be suggested again."; await loadRubricChoices(); await refreshReview(); render(); }
    else if (!path && await applyRubricChoice(true)) { await loadRubricChoices(); render(); }
  } else if (act === "keep-rubric") {
    S.replaceWarn = null; S.pendingUse = null; await loadRubricChoices(); render();
  } else if (act === "continue") {
    if (!(await applyRubricChoice(false))) return;
    await goMatch();
  } else if (act === "back-start") {
    await refreshState(); await refreshMatches(); show("start");
  } else if (act === "back-match") {
    await goMatch();
  } else if (act === "start-grading") {
    await runGrading();
  } else if (act === "stop") {
    if (S.run) { S.run.stop = true; render(); }
  } else if (act === "to-review") {
    await toReview();
  } else if (act === "new-batch") {
    await refreshState(); await refreshMatches(); await loadRubricChoices(); show("start");
  } else if (act === "settings") {
    const t = await call("get_settings");
    if (ok(t)) { S.settings = t; render(); setTimeout(() => { const k = $("#set-key"); if (k) k.focus(); }, 0); }
  } else if (act === "close-settings") {
    S.settings = null; render();
  } else if (act === "save-settings") {
    const key = $("#set-key").value.trim();
    const values = { model: $("#set-model").value.trim(), anonymize: $("#set-anon").checked, send_images: $("#set-img").checked };
    if (key) values.api_key = key;
    const t = await call("save_settings", values);
    if (ok(t)) { S.settings = t; await refreshState(); render(); toast("Settings saved."); }
  } else if (act === "remove-key") {
    const t = await call("save_settings", { api_key: "" });
    if (ok(t)) { S.settings = t; await refreshState(); render(); toast("API key removed."); }
  } else if (act === "test-connection") {
    toast("Testing…");
    const r = await call("test_connection");
    if (ok(r)) toast(r.message);
  } else if (act === "close-drawer") {
    S.ev = null; render();
  } else if (act === "export-excel" || act === "export-csv") {
    const csv = act === "export-csv";
    const r = await call("export_review", csv ? "csv" : "excel");
    if (ok(r)) {
      S.exportNote = { title: csv ? "CSV saved" : "Excel saved", file: r.file, refused: r.refused,
        text: `${plural(r.teams, "team")} (${plural(r.rows, "row")}) written${r.left_out ? `; ${plural(r.left_out, "team")} not reviewed left out` : ""}. ${csv ? "One row per student, four columns." : "Tabs: Grades, Details and Rubric."}` };
      render(); toast(csv ? "CSV saved." : "Excel saved.");
    }
  } else if (act === "export-all") {
    const r = await call("export_all", S.includeUnapproved);
    if (ok(r)) { S.exportNote = { title: "Full export finished", file: r.folder, lines: r.lines, text: "Everything was written to the _grading folder." }; render(); toast("Export finished."); }
  } else if (act === "show") {
    await call("show_exports");
  }
}

async function afterFolder(st) {
  S.state = st; S.replaceWarn = null; S.usedNote = ""; S.exportNote = null; S.open = {}; S.editing = {}; S.ev = null; S.mode = null;
  await loadRubricChoices();
  await refreshReview();
  await refreshMatches();
  show("start");
}

document.addEventListener("click", async (e) => {
  if (e.target.dataset && e.target.dataset.act === "close-settings-bg") { S.settings = null; return render(); }
  const b = e.target.closest("button,[data-act]");
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.toggle) { S.open[d.toggle] = !S.open[d.toggle]; if (!S.open[d.toggle]) delete S.editing[d.toggle]; return render(); }
  if (d.review) {
    const r = S.review.rows.find((x) => x.id === d.review);
    if (!r || !r.complete) return;
    const res = await call(r.status === "approved" ? "reopen" : "approve", r.id);
    if (ok(res)) { if (r.status !== "approved") { S.open[r.id] = false; delete S.editing[r.id]; } await refreshAll(); render(); }
    return;
  }
  if (d.fill) {
    S.open[d.fill] = true; S.editing[d.fill] = true; render();
    const r = S.review.rows.find((x) => x.id === d.fill), gap = r && r.criteria.find((c) => c.final == null);
    const inp = gap && document.getElementById(`in-${d.fill}-${gap.id}`); if (inp) inp.focus();
    return;
  }
  if (d.edit) { S.editing[d.edit] = true; render(); const f = document.querySelector(`#d-${CSS.escape(d.edit)} input[data-score]`); if (f) f.focus(); return; }
  if (d.done) { delete S.editing[d.done]; return render(); }
  if (d.reset) {
    const r = S.review.rows.find((x) => x.id === d.reset);
    for (const c of r.criteria) if (c.ai_score != null && c.final !== c.ai_score) await call("set_score", r.id, c.id, c.ai_score);
    delete S.editing[d.reset]; await refreshAll(); render(); toast("Back to the suggested scores.");
    return;
  }
  if (d.evOpen) { const [id, tab] = d.evOpen.split("|"); return loadEvidence(id, tab, null); }
  if (d.tab) { S.ev.tab = d.tab; return render(); }
  if (d.ev) {
    const m = d.ev.match(/^cell (\d+)/i), v = d.ev.match(/^video (\d+):(\d+)(?::(\d+))?/i), id = d.evid;
    if (m) return loadEvidence(id, "notebook", +m[1]);
    if (v) {
      const sec = v[3] != null ? +v[1] * 3600 + +v[2] * 60 + +v[3] : +v[1] * 60 + +v[2];
      await loadEvidence(id, "video", null); seekVideo(sec);
    }
    return;
  }
  if (d.act) return onAct(d.act, b);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.settings) { S.settings = null; render(); } else if (S.ev) { S.ev = null; render(); } }
});
document.addEventListener("change", async (e) => {
  const t = e.target, d = t.dataset || {};
  if (t.id === "rubric") { S.rubricPick = t.value; S.usedNote = ""; S.replaceWarn = null; await loadRubricPreview(); return render(); }
  if (t.id === "incl") { S.includeUnapproved = t.checked; return; }
  if (t.id === "regrade") { S.regrade = t.checked; return; }
  if (t.name === "mode") { S.mode = t.value; return; }
  if (d.pick) {
    const v = t.value;
    let r;
    if (v === "none") r = await call("set_no_video", d.pick, true);
    else if (v.startsWith("file:")) r = await call("assign_file", v.slice(5), d.pick);
    else {
      // "Undo": take back any file the professor gave this team, and any 'no video' choice
      const mine = S.matches.unmatched.filter((f) => f.assigned_to === d.pick);
      for (const f of mine) await call("assign_file", f.path, "");
      r = await call("set_no_video", d.pick, false);
    }
    if (ok(r)) { S.matches = r; render(); const sel = document.getElementById(`pick-${d.pick}`); if (sel) sel.focus(); }
    return;
  }
  if (d.score) {
    const i = d.score.indexOf("|"), id = d.score.slice(0, i), crit = d.score.slice(i + 1);
    if (t.value.trim() === "") { toast("Enter a number from 0 to the maximum.", true); await refreshReview(); return render(); }
    return setScore(id, crit, Number(t.value));
  }
  if (d.cmt) { const i = d.cmt.indexOf("|"); if (ok(await call("set_comment", d.cmt.slice(0, i), d.cmt.slice(i + 1), t.value))) { toast("Comment saved."); await refreshReview(); } return; }
  if (d.fb) { if (ok(await call("set_feedback", d.fb, t.value))) toast("Feedback saved."); return; }
});

// ---------------------------------------------------------------------------
// Start: wait for the Python bridge. The page can also run against the dev server
// (python -m desktop.devserver, then open http://127.0.0.1:8765/ ).
// ---------------------------------------------------------------------------
let started = false;
async function start() {
  if (started) return;
  started = true;
  await refreshState();
  await loadRubricChoices();
  await refreshMatches();
  await refreshReview();
  S.view = "start";
  render();
}
window.addEventListener("pywebviewready", start);
if (window.pywebview && window.pywebview.api && window.pywebview.api.get_state) start();
setTimeout(() => {
  if (started) return;
  $("#root").innerHTML = `<section class="start"><div class="panel"><h2>Start the app with Python</h2><p class="muted">This page is the app's screen. Run <span class="mono">python app.py</span> to open it, or <span class="mono">python -m desktop.devserver</span> to use it in a browser.</p></div></section>`;
}, 1500);
})();
</script>
</body>
