<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Grade</title>
<style>
/* Same look as the demo page. System fonts only: the app works offline. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EDF0F4; --ink:#17202B; --muted:#5A6576; --line:#D8DDE5;
  --accent:#2B54C6; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --vid:#7B3BB0; --vid-soft:#F0E5F8;
  --ok:#1D774A; --ok-soft:#DDF1E5; --warn:#8F5B00; --warn-soft:#FFF0D2; --bad:#B0222B; --bad-soft:#FBE2E3;
  --code-bg:#F7F8FA;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1218; --surface:#151A22; --surface-2:#1C222C; --ink:#E5E9EF; --muted:#9AA4B4; --line:#2A313C;
  --accent:#7E9DF4; --accent-ink:#0E1218; --accent-soft:#1E2946;
  --vid:#C18FEA; --vid-soft:#2C1F3A;
  --ok:#5BC38C; --ok-soft:#142D1F; --warn:#E6B24D; --warn-soft:#32270F; --bad:#F27E85; --bad-soft:#38191C;
  --code-bg:#11161D; color-scheme:dark;}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:14px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);font-weight:500;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* shell */
.shell{height:100%;display:grid;grid-template-rows:auto 1fr;}
.titlebar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);min-width:0}
.titlebar .name{font-weight:600}
.titlebar .path{font:12px var(--f-mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlebar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{font:500 11px var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.rail{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;background:var(--surface);overflow:auto}
.step{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:center;text-align:left;border:0;background:none;padding:10px;border-radius:var(--r)}
.step .n{grid-row:span 2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-mono);border:1px solid var(--line);color:var(--muted)}
.step .t{font-weight:600}
.step .s{font-size:12px;color:var(--muted)}
.step:hover{background:var(--surface-2)}
.step[aria-current="step"]{background:var(--accent-soft)}
.step[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step:disabled{opacity:.45;cursor:not-allowed}
.work{padding:22px;overflow:auto;display:grid;gap:18px;align-content:start;grid-auto-rows:max-content;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lede{color:var(--muted);max-width:70ch;margin-top:4px}

/* bits */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:99px;white-space:nowrap}
.src-notebook{background:var(--accent-soft);color:var(--accent)}
.src-video{background:var(--vid-soft);color:var(--vid)}
.src-both{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.st-approved{background:var(--ok-soft);color:var(--ok)}
.st-graded{background:var(--warn-soft);color:var(--warn)}
.st-pending,.st-error{background:var(--surface-2);color:var(--muted)}
.flag{background:var(--bad-soft);color:var(--bad)}
.ev{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ev:hover{border-color:var(--accent);color:var(--accent)}
.note{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:grid;min-width:110px;background:var(--surface)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.crit-row{cursor:pointer}
.crit-row:hover td{background:var(--surface-2)}
.levels td{background:var(--code-bg)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.lvl{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)}
td.chg{color:var(--bad);font-weight:600}
tr.unapproved td{background:var(--warn-soft)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* welcome */
.welcome{display:grid;place-items:center;height:100%;padding:24px}
.welcome .card{max-width:560px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.welcome ol{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}

/* review */
.review{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(320px,400px);gap:16px;align-items:start}
.queue{display:grid;gap:4px;max-height:calc(100vh - 220px);overflow:auto}
.qitem{display:grid;grid-template-columns:1fr auto;gap:2px 6px;border:1px solid transparent;background:none;text-align:left;padding:8px;border-radius:6px}
.qitem:hover{background:var(--surface-2)}
.qitem[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qitem .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .tt{font:500 12px var(--f-mono);color:var(--muted)}
.qitem .chip{grid-column:1/-1;justify-self:start}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);align-items:center}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .file{margin-left:auto;padding:0 12px;font:11px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.panel-body{padding:12px;display:grid;gap:10px;max-height:calc(100vh - 230px);overflow:auto}
.cell{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;border-radius:6px;padding:4px;transition:background .3s}
.cell .in{font:11px var(--f-mono);color:var(--muted);padding-top:8px;text-align:right;line-height:1.3}
.cell pre{margin:0;font:12px/1.5 var(--f-mono);background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto}
.cell .md{padding:4px 10px;white-space:pre-wrap}
.cell .out{font:12px/1.5 var(--f-mono);padding:6px 10px;white-space:pre;overflow-x:auto}
.cell .out.err{color:var(--bad);background:var(--bad-soft);border-radius:6px}
.cell img{max-width:100%;height:auto;display:block;margin-top:6px;background:#fff;border-radius:4px}
.cell.hl{background:var(--warn-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
video{width:100%;border-radius:6px;background:#000;max-height:60vh}
.scorecard{display:grid;gap:10px}
.crit{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;background:var(--surface)}
.crit.low{border-color:var(--warn)}
.crit-top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font:500 12px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg .ai{font-size:9px;color:var(--accent);margin-left:4px}
.seg button[aria-pressed="true"] .ai{color:var(--surface)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.changed{color:var(--bad);font:600 11px var(--f-mono)}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px var(--f-body);background:var(--surface);color:var(--ink);resize:vertical}
.totalbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.totalbar b{font-size:22px;font-variant-numeric:tabular-nums}
.flagline{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:6px 10px;font-size:13px}
.result{font:12px/1.7 var(--f-mono);white-space:pre-wrap}
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:24px;z-index:5}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;display:grid;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:13px}
.field input[type=text],.field input[type=password]{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:13px var(--f-mono);background:var(--surface);color:var(--ink);width:100%}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.hint{font-size:12px;color:var(--muted)}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
details.tools{border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px}
details.tools summary{cursor:pointer;color:var(--muted);font-size:13px}
.fail{font-size:13px;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:var(--r);font-size:13px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgb(0 0 0 / .25);z-index:10}
.toast.err{background:var(--bad);color:#fff}

@media (max-width:1180px){.review{grid-template-columns:180px minmax(0,1fr)}.review .scorecol{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root" class="welcome"><p class="muted">Starting…</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
"use strict";
// ---------------------------------------------------------------------------
// State. Python is the source of truth; this only remembers what's on screen.
// ---------------------------------------------------------------------------
const S = {
  state: null,          // from api.get_state()
  step: 0,              // 0 rubric · 1 submissions · 2 grading · 3 review · 4 export
  sel: null,            // selected student id in Review
  student: null,        // from api.get_student()
  evTab: "notebook",
  hlCell: null,
  openCrit: null,
  grading: null,        // {done, total, current}
  exportResult: null,
  includeUnapproved: false,
  replaceWarn: null,
  settings: null,       // from api.get_settings() while the Settings window is open
  lastRun: null,        // summary of the last AI grading run
};
const SRC = { notebook: "Notebook", video: "Video", both: "Both" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n == null ? "—" : String(Math.round(n * 10) / 10));
const isMac = /Mac/i.test(navigator.platform || navigator.userAgent);

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.hidden = false;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => (t.hidden = true), isErr ? 6000 : 3200);
}

// Call Python. Returns the result, or null after showing the error.
async function call(name, ...args) {
  try {
    const r = await window.pywebview.api[name](...args);
    if (!r || r.ok === false) {
      if (!(r && r.cancelled)) toast((r && r.error) || "Something went wrong.", true);
      return r && r.error ? { failed: true, error: r.error } : null;
    }
    return r;
  } catch (e) {
    toast(String((e && e.message) || e), true);
    return null;
  }
}
const ok = (r) => r && !r.failed;
// Same as call() but returns {error} instead of showing a toast (for batch runs).
async function callQuiet(name, ...args) {
  try {
    const r = await window.pywebview.api[name](...args);
    return r && r.ok !== false ? r : { failed: true, error: (r && r.error) || "Something went wrong." };
  } catch (e) {
    return { failed: true, error: String((e && e.message) || e) };
  }
}

async function refresh() {
  const st = await call("get_state");
  if (ok(st)) S.state = st;
  render();
}
async function loadStudent(id) {
  S.sel = id;
  const d = await call("get_student", id);
  S.student = ok(d) ? d : null;
}

// ---------------------------------------------------------------------------
// Views
// ---------------------------------------------------------------------------
function viewWelcome() {
  return `<div class="card">
    <h1>Easy Grade</h1>
    <p class="muted">Grade notebook + video projects against your rubric. Everything stays on this computer.</p>
    <ol>
      <li>Open the folder with the students' submissions (the unzipped LMS download).</li>
      <li>Choose the rubric.</li>
      <li>Grade, review each student, approve.</li>
      <li>Export grades to Excel and a gradebook CSV.</li>
    </ol>
    <p class="muted" style="font-size:13px">The app saves its work in a <span class="mono">_grading</span> folder inside the folder you open, so you can stop and come back later.</p>
    <div class="actions"><button class="btn primary" data-act="choose-folder">Open submissions folder…</button></div>
  </div>`;
}

function stepsInfo() {
  const st = S.state, c = st.counts, r = st.rubric;
  return [
    { t: "Rubric", s: r ? `${r.criteria.length} criteria · ${fmt(r.total_points)} pts` : "Not chosen yet", on: true },
    { t: "Submissions", s: `${st.students.length} students · ${c.flagged} flagged`, on: true },
    { t: "Grading", s: `${c.graded + c.approved} graded`, on: !!r },
    { t: "Review", s: `${c.graded} waiting`, on: !!r },
    { t: "Export", s: `${c.approved} approved`, on: !!r },
  ];
}

function viewShell() {
  const st = S.state;
  return `<div class="shell">
    <div class="titlebar">
      <span class="name">Easy Grade</span>
      <span class="path" title="${esc(st.folder)}">${esc(st.rubric ? st.rubric.assignment + " · " : "")}${esc(st.folder)}</span>
      <span class="right">${st.ai_ready ? `<span class="pill ai" title="Notebook text and charts are sent to the AI service for grading. Videos stay on this computer.">AI grading on</span>` : `<span class="pill" title="Files are read and processed on this computer">Runs locally</span>`}<button class="btn" data-act="settings">Settings</button><button class="btn" data-act="choose-folder">Change folder…</button></span>
    </div>
    <div class="body">
      <nav class="rail" aria-label="Steps">${stepsInfo().map((x, i) => `<button class="step" data-step="${i}" ${S.step === i ? 'aria-current="step"' : ""} ${x.on ? "" : "disabled"}><span class="n">${i + 1}</span><span class="t">${x.t}</span><span class="s">${esc(x.s)}</span></button>`).join("")}</nav>
      <main class="work" id="work">${[viewRubric, viewSubmissions, viewGrading, viewReview, viewExport][S.step]()}</main>
    </div>
  </div>`;
}

function rubricTable(r) {
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Criterion</th><th>Graded from</th><th class="r">Points</th><th>Level scores</th></tr></thead>
    <tbody>${r.criteria.map((c) => `
      <tr class="crit-row" data-crit="${esc(c.id)}" tabindex="0"><td><b>${esc(c.name)}</b><div class="muted mono" style="font-size:11px">${esc(c.id)}</div></td>
      <td><span class="chip src-${c.source}">${SRC[c.source]}</span></td><td class="r num">${fmt(c.points)}</td>
      <td class="muted num">${c.levels.map((l) => fmt(l.score)).join(" / ")}</td></tr>
      ${S.openCrit === c.id ? `<tr class="levels"><td colspan="4"><div class="lvls">${c.levels.map((l) => `<div class="lvl"><b>${fmt(l.score)}</b> · ${esc(l.label)}<div class="muted" style="font-size:12px;margin-top:4px">${esc(l.description)}</div></div>`).join("")}</div></td></tr>` : ""}`).join("")}
    </tbody></table></div>`;
}

function viewRubric() {
  const r = S.state.rubric;
  const warn = S.replaceWarn ? `<div class="note warn"><b>This assignment already has scores.</b><p>${esc(S.replaceWarn)}</p><div class="actions"><button class="btn primary" data-act="replace-rubric">Choose a rubric and replace anyway</button><button class="btn" data-act="cancel-replace">Keep the current rubric</button></div></div>` : "";
  if (!r) {
    return `<div class="head"><div><h2>1 · Rubric</h2><p class="lede">Choose the rubric for this assignment: a .json file, or an Excel/CSV sheet with one row per level. The app checks it and keeps a copy in <span class="mono">_grading/rubric.json</span>.</p></div></div>
      ${warn}
      <div class="actions"><button class="btn primary" data-act="choose-rubric">Choose rubric file…</button><button class="btn" data-act="sample-rubric">Use the sample rubric</button><button class="btn" data-act="template">Save Excel template…</button></div>`;
  }
  const by = (k) => r.criteria.filter((c) => c.source === k).reduce((a, c) => a + c.points, 0);
  return `<div class="head"><div><h2>1 · Rubric</h2><p class="lede">${esc(r.assignment)}. The AI must pick one of these levels for each criterion, and each criterion becomes a column in the export. Click a row to see its levels.</p></div>
    <div class="actions"><button class="btn" data-act="choose-rubric">Replace rubric…</button><button class="btn" data-act="template">Save Excel template…</button></div></div>
    ${warn}
    <div class="stats"><div class="stat"><b>${fmt(r.total_points)}</b><span>points total</span></div><div class="stat"><b>${fmt(by("notebook"))}</b><span>from the notebook</span></div><div class="stat"><b>${fmt(by("video"))}</b><span>from the video</span></div><div class="stat"><b>${fmt(by("both"))}</b><span>video vs. notebook</span></div></div>
    ${rubricTable(r)}
    <div class="actions"><button class="btn primary" data-step="1">Next: check submissions</button></div>`;
}

function viewSubmissions() {
  const st = S.state;
  const rows = st.students.map((s) => `<tr><td class="mono num">${esc(s.id)}</td><td>${esc(s.name || "—")}</td>
      <td>${s.has_notebook ? "✓" : "—"}</td><td>${s.has_video ? "✓" : "—"}</td>
      <td><span class="chip st-${s.status}">${esc(s.status_label)}</span></td>
      <td>${s.flags.length ? s.flags.map((f) => `<span class="chip flag" title="${esc(f)}">${esc(f.length > 50 ? f.slice(0, 48) + "…" : f)}</span>`).join(" ") : '<span class="muted">—</span>'}</td></tr>`).join("");
  return `<div class="head"><div><h2>2 · Submissions</h2><p class="lede">Each student is matched to a notebook and a video. Works with one folder per student or the flat LMS download naming. Anything that needs attention is flagged.</p></div>
    <div class="actions"><button class="btn" data-act="scan" ${st.rubric ? "" : "disabled"}>Scan folder again</button></div></div>
    <p class="muted" style="font-size:13px">${st.roster ? `Names and emails come from <span class="mono">${esc(st.roster.split(/[\\/]/).pop())}</span>.` : `No roster found. Put a <span class="mono">roster.csv</span> (student_id, student_name, email) in the folder to get names and emails.`}</p>
    ${st.students.length ? `<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Student</th><th>Notebook</th><th>Video</th><th>Status</th><th>Needs attention</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="note">No submissions found in this folder. Open the folder that contains the students' files.</div>`}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
async function goStep(i) {
  S.step = i;
  if (i === 3) {
    const sts = S.state.students;
    if (!S.sel || !sts.some((s) => s.id === S.sel)) {
      const first = sts.find((s) => s.status === "graded") || sts[0];
      S.sel = first ? first.id : null;
    }
    if (S.sel) await loadStudent(S.sel);
  }
  render();
}

async function runSimulated() {
  const list = S.state.students.filter((s) => s.has_notebook || s.has_video);
  S.grading = { done: 0, total: list.length, current: [], tokens: 0 };
  render();
  for (const s of list) {
    await callQuiet("grade_simulated", s.id);
    S.grading.done++;
    if (S.step === 2) render();
  }
  S.grading = null;
  await refresh();
  toast(`Filled ${list.length} students with simulated scores.`);
}

// Grade with AI, 3 students at a time. Stop finishes the ones in progress.
async function runAI(all) {
  const list = S.state.students.filter((s) => s.has_notebook && (all || s.status === "pending"));
  S.grading = { done: 0, total: list.length, current: [], tokens: 0, stop: false };
  const result = { ok: 0, skipped: 0, failed: [], tokens: 0 };
  render();
  let next = 0;
  async function worker() {
    while (next < list.length && !S.grading.stop) {
      const s = list[next++];
      const label = s.name || s.id;
      S.grading.current.push(label);
      if (S.step === 2) render();
      const r = await callQuiet("grade_student", s.id);
      S.grading.current = S.grading.current.filter((x) => x !== label);
      if (r.failed) {
        result.failed.push({ name: label, error: r.error });
        // A bad key or model will fail for everyone: stop right away.
        if (/API key|wasn't found|Settings/.test(r.error)) S.grading.stop = true;
      } else if (r.skipped) result.skipped++;
      else {
        result.ok++;
        const u = r.usage || {};
        result.tokens += (u.input_tokens || 0) + (u.output_tokens || 0);
        S.grading.tokens = result.tokens;
      }
      S.grading.done++;
      if (S.step === 2) render();
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  S.grading = null;
  S.lastRun = result;
  await refresh();
  if (result.failed.length) toast(`${result.failed.length} student(s) couldn't be graded. See the list in Grading.`, true);
  else toast(`AI graded ${result.ok} notebook${result.ok === 1 ? "" : "s"}. They're waiting for you in Review.`);
}

async function openSettings() {
  const t = await call("get_settings");
  if (ok(t)) { S.settings = t; render(); setTimeout(() => { const k = $("#set-key"); if (k) k.focus(); }, 0); }
}
async function saveSettings() {
  const key = $("#set-key").value.trim();
  const values = { model: $("#set-model").value.trim(), anonymize: $("#set-anon").checked, send_images: $("#set-img").checked };
  if (key) values.api_key = key;
  const t = await call("save_settings", values);
  if (ok(t)) { S.settings = t; await refresh(); toast("Settings saved."); }
}

async function afterScoreChange() {
  await loadStudent(S.sel);
  const st = await call("get_state");
  if (ok(st)) S.state = st;
  renderReviewParts(["queue", "score"]);
}

function seekVideo(sec) {
  const v = $("#vid");
  if (!v) return;
  const go = () => { v.currentTime = sec; };
  if (v.readyState >= 1) go(); else v.addEventListener("loadedmetadata", go, { once: true });
}

async function onAct(act) {
  if (act === "choose-folder") {
    const st = await call("choose_folder");
    if (ok(st)) { S.state = st; S.sel = null; S.student = null; S.exportResult = null; S.step = st.rubric ? 3 : 0; if (S.step === 3) return goStep(3); render(); }
  } else if (act === "choose-rubric" || act === "replace-rubric") {
    const st = await call("choose_rubric", act === "replace-rubric");
    if (st && st.failed && /already has scores/.test(st.error)) { S.replaceWarn = st.error; render(); return; }
    if (ok(st)) { S.state = st; S.replaceWarn = null; render(); toast("Rubric saved."); }
  } else if (act === "cancel-replace") {
    S.replaceWarn = null; render();
  } else if (act === "sample-rubric") {
    const st = await call("use_sample_rubric");
    if (ok(st)) { S.state = st; render(); toast("Sample rubric loaded."); }
  } else if (act === "template") {
    const r = await call("save_rubric_template");
    if (ok(r)) toast("Template saved: " + r.path);
  } else if (act === "scan") {
    const st = await call("scan");
    if (ok(st)) { S.state = st; render(); toast(`Found ${st.students.length} students.`); }
  } else if (act === "simulate") {
    await runSimulated();
  } else if (act === "ai-grade" || act === "ai-grade-all") {
    await runAI(act === "ai-grade-all");
  } else if (act === "stop") {
    if (S.grading) { S.grading.stop = true; render(); }
  } else if (act === "settings") {
    await openSettings();
  } else if (act === "close-settings") {
    S.settings = null; render();
  } else if (act === "save-settings") {
    await saveSettings();
  } else if (act === "remove-key") {
    const t = await call("save_settings", { api_key: "" });
    if (ok(t)) { S.settings = t; await refresh(); toast("API key removed."); }
  } else if (act === "test-connection") {
    toast("Testing…");
    const r = await call("test_connection");
    if (ok(r)) toast(r.message);
  } else if (act === "approve") {
    const cur = S.sel;
    if (!ok(await call("approve", cur))) return;
    const st = await call("get_state");
    if (ok(st)) S.state = st;
    const next = S.state.students.find((s) => s.status === "graded" && s.id !== cur);
    toast(next ? `Approved. Next: ${next.name || next.id}.` : "Approved. Nothing left to review.");
    S.hlCell = null;
    await loadStudent(next ? next.id : cur);
    renderReviewParts(["queue", "evidence", "score"]);
  } else if (act === "reopen") {
    if (ok(await call("reopen", S.sel))) await afterScoreChange();
  } else if (act === "export") {
    const r = await call("export_all", S.includeUnapproved);
    if (ok(r)) { S.exportResult = r; render(); toast("Export finished."); }
  } else if (act === "show") {
    await call("show_exports");
  }
}

document.addEventListener("click", async (e) => {
  if (e.target.dataset && e.target.dataset.act === "close-settings-bg") { S.settings = null; return render(); }
  const b = e.target.closest("button,[data-crit]");
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.step != null) return goStep(+d.step);
  if (d.crit) { S.openCrit = S.openCrit === d.crit ? null : d.crit; return render(); }
  if (d.sel) { S.hlCell = null; await loadStudent(d.sel); return renderReviewParts(["queue", "evidence", "score"]); }
  if (d.tab) { S.evTab = d.tab; return renderReviewParts(["evidence"]); }
  if (d.score) {
    const i = d.score.lastIndexOf("|");
    if (ok(await call("set_score", S.sel, d.score.slice(0, i), Number(d.score.slice(i + 1))))) await afterScoreChange();
    return;
  }
  if (d.ev) {
    const m = d.ev.match(/^cell (\d+)/i), v = d.ev.match(/^video (\d+):(\d+)(?::(\d+))?/i);
    if (m) {
      S.evTab = "notebook"; S.hlCell = +m[1]; renderReviewParts(["evidence"]);
      const el = $("#cell-" + m[1]), body = $("#evbody");
      if (el && body) body.scrollTop += el.getBoundingClientRect().top - body.getBoundingClientRect().top - 12;
    } else if (v) {
      const sec = v[3] != null ? +v[1] * 3600 + +v[2] * 60 + +v[3] : +v[1] * 60 + +v[2];
      if (S.evTab !== "video") { S.evTab = "video"; renderReviewParts(["evidence"]); }
      seekVideo(sec);
    }
    return;
  }
  if (d.act) return onAct(d.act);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.settings) { S.settings = null; render(); return; }
  const r = e.target.closest && e.target.closest("[data-crit]");
  if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); r.click(); }
});
// Text fields save when you leave them.
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.id === "incl") { S.includeUnapproved = t.checked; return; }
  if (t.dataset.cmt) { if (ok(await call("set_comment", S.sel, t.dataset.cmt, t.value))) toast("Comment saved."); return; }
  if (t.dataset.fb) { if (ok(await call("set_feedback", S.sel, t.value))) toast("Feedback saved."); return; }
});

// ---------------------------------------------------------------------------
// Start: wait for the Python bridge. Open with ?mock in a browser to work on
// the UI without Python (loads dev_mock.js).
// ---------------------------------------------------------------------------
let started = false;
async function start() {
  if (started) return;
  started = true;
  await refresh();
  if (S.state && S.state.rubric) await goStep(S.state.counts.graded ? 3 : 2);
}
window.addEventListener("pywebviewready", start);
if (window.pywebview && window.pywebview.api && window.pywebview.api.get_state) start();
setTimeout(() => {
  if (started) return;
  if (/mock/.test(location.search + location.hash)) {
    const s = document.createElement("script");
    s.src = "dev_mock.js";
    s.onload = start;
    document.body.appendChild(s);
  } else {
    $("#root").innerHTML = `<div class="card" style="max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:8px"><h2>Start the app with Python</h2><p class="muted">This page is the app's screen. Run <span class="mono">python app.py</span> to open it, or add <span class="mono">?mock</span> to the address to try it with fake data.</p></div>`;
  }
}, 1500);
})();
</script>
</body>
