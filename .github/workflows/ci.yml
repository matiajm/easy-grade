name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r easygrade/requirements.txt
      - name: Real-data guard
        run: python .github/scripts/real_data_guard.py
      - name: Tests
        run: python -m pytest
